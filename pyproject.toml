[tool.poetry]
name = "voxcart"
version = "0.1.0"
description = "AI-powered e-commerce chatbot platform with FastAPI, React, and OpenAI integration for conversational commerce"
authors = ["VoxCart Contributors"]
readme = "README.md"

[tool.poetry.dependencies]
#python = "^3.10"
python = ">=3.10,<3.13"
fastapi = "^0.115.8"
uvicorn = "^0.34.0"
pydantic = {extras = ["email"], version = "^2.10.6"}
requests = "^2.32.3"
python-dotenv = "^1.0.1"
ujson = "^5.10.0"
gunicorn = "^23.0.0"
openai = "^1.63.0"
logging = "^0.4.9.6"
faiss-cpu = "^1.10.0"
langchain = "^0.3.18"
langchain-community = "^0.3.17"
tiktoken = "^0.9.0"
langchain-openai = "^0.3.6"
sqlalchemy = "^2.0.38"
scikit-learn = "^1.6.1"
psycopg2 = "^2.9.10"
pytest = "^8.3.4"
chromadb = "^0.6.3"
pydantic-settings = "^2.7.1"
alembic = "^1.14.1"
rapidfuzz = "^3.12.1"
pycryptodome = "^3.21.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyjwt = "^2.10.1"
python-multipart = "^0.0.20"
python-jose = "^3.4.0"
future = "^1.0.0"
starlette = "^0.46.0"
itsdangerous = "^2.2.0"
unicodedata2 = "^16.0.0"
giskard = [
  { version = "^2.16.2", python = ">=3.9,<3.13" }
]



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
